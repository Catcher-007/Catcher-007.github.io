<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06121f">
<meta name="description" content="AQUA — Interactive Boids fish school simulation">
<title>AQUA — 灵动鱼群</title>
<style>
:root{--bg:#06121f;--panel:rgba(8,24,40,.68);--line:rgba(170,225,255,.14);--text:#edf9ff;--muted:#8ba9bb;--cyan:#65e8ff;--shadow:0 24px 70px rgba(0,0,0,.38)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);touch-action:none}body{color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:none}.vignette,.noise{position:fixed;inset:0;pointer-events:none}.vignette{background:radial-gradient(circle at 72% 18%,rgba(36,156,210,.12),transparent 30%),radial-gradient(circle at 20% 82%,rgba(67,91,196,.1),transparent 32%),linear-gradient(180deg,rgba(2,10,18,.08),rgba(2,9,17,.55))}.noise{opacity:.035;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E")}
.hud{position:fixed;inset:0;padding:28px;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between}.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}.brand,.panel,.hint,.stats{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(18px) saturate(130%);-webkit-backdrop-filter:blur(18px) saturate(130%)}.brand{padding:18px 20px;border-radius:18px;min-width:250px}.eyebrow{display:flex;align-items:center;gap:8px;color:var(--cyan);font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}.dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 14px var(--cyan)}h1{margin:8px 0 3px;font-size:clamp(25px,3vw,38px);line-height:1;letter-spacing:-.04em}.subtitle{margin:0;color:var(--muted);font-size:12px}.panel{width:min(290px,calc(100vw - 56px));padding:16px;border-radius:18px;pointer-events:auto}.panel-title{margin-bottom:12px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}.control{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 0;border-top:1px solid rgba(255,255,255,.07)}.control:first-of-type{border-top:0}.control label{color:#c5dbe7;font-size:13px}input[type=range]{width:105px;accent-color:var(--cyan)}.value{width:38px;color:var(--cyan);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}button{width:100%;margin-top:8px;padding:10px 12px;border:1px solid rgba(101,232,255,.18);border-radius:10px;color:var(--text);background:rgba(101,232,255,.07);cursor:pointer;transition:.2s ease}button:hover{background:rgba(101,232,255,.14);border-color:rgba(101,232,255,.35);transform:translateY(-1px)}.bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:18px}.hint{padding:13px 16px;border-radius:14px;color:#b9d2df;font-size:12px}.hint strong{color:#f3fcff}.stats{display:flex;gap:20px;padding:13px 16px;border-radius:14px;min-width:190px}.stat span{display:block;color:var(--muted);font-size:9px;letter-spacing:.12em;text-transform:uppercase}.stat b{display:block;margin-top:2px;font-size:14px;font-variant-numeric:tabular-nums}
.mobile-controls{display:none}.mobile-button{border-radius:999px;width:auto;padding:10px 14px;margin:0;background:rgba(101,232,255,.1);font-size:12px}.touch-tip{display:none}
/* Phase 1: atmospheric depth */
.atmosphere,.light-rays,.particles{position:fixed;inset:0;pointer-events:none}.atmosphere{z-index:-1;background:radial-gradient(ellipse at 50% 112%,rgba(26,125,166,.14),transparent 48%),radial-gradient(ellipse at 10% 30%,rgba(34,91,150,.08),transparent 42%);animation:drift 14s ease-in-out infinite alternate}.light-rays{z-index:-1;opacity:.18;background:linear-gradient(116deg,transparent 0 38%,rgba(112,224,255,.05) 43%,transparent 50%),linear-gradient(72deg,transparent 0 62%,rgba(112,224,255,.035) 68%,transparent 75%);transform:translateX(-3%);animation:rays 18s ease-in-out infinite alternate}.particles{z-index:0;overflow:hidden}.particle{position:absolute;width:2px;height:2px;border-radius:50%;background:rgba(177,235,255,.55);box-shadow:0 0 8px rgba(101,232,255,.25);animation:float linear infinite}.bubble{position:absolute;border:1px solid rgba(177,235,255,.14);border-radius:50%;animation:bubble linear infinite}
@keyframes drift{from{transform:scale(1) translate3d(-1%,0,0)}to{transform:scale(1.06) translate3d(1%,-1%,0)}}@keyframes rays{from{transform:translateX(-4%) rotate(-1deg)}to{transform:translateX(4%) rotate(1deg)}}@keyframes float{from{transform:translate3d(0,105vh,0);opacity:0}12%{opacity:.55}88%{opacity:.4}to{transform:translate3d(25px,-10vh,0);opacity:0}}@keyframes bubble{from{transform:translate3d(0,110vh,0) scale(.7);opacity:0}15%{opacity:.5}to{transform:translate3d(-35px,-12vh,0) scale(1.1);opacity:0}}
@media(max-width:700px){.hud{padding:12px;padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom))}.topbar{align-items:flex-start}.brand{min-width:0;padding:12px 14px;border-radius:15px}.eyebrow{font-size:9px}.dot{width:6px;height:6px}h1{font-size:26px}.subtitle{font-size:10px}.panel{display:none}.mobile-controls{display:flex;position:fixed;right:12px;top:max(12px,env(safe-area-inset-top));pointer-events:auto;gap:7px}.bottom{display:grid;grid-template-columns:1fr auto;align-items:end;gap:8px}.hint{display:none}.stats{min-width:0;width:100%;gap:12px;padding:9px 11px;border-radius:12px}.stat span{font-size:8px}.stat b{font-size:12px}.touch-tip{display:block;position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom));transform:translateX(-50%);white-space:nowrap;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(8,24,40,.55);color:#b9d2df;font-size:10px;backdrop-filter:blur(12px);opacity:.9}.mobile-panel{position:fixed;left:12px;right:12px;bottom:calc(58px + env(safe-area-inset-bottom));padding:14px;border-radius:16px;display:none;pointer-events:auto}.mobile-panel.open{display:block}.mobile-panel .control{padding:8px 0}.mobile-panel input[type=range]{width:min(48vw,180px)}}
@media(min-width:701px){.mobile-controls,.mobile-panel,.touch-tip{display:none!important}}
</style>
</head>
<body>
<canvas id="fishCanvas"></canvas><div class="atmosphere"></div><div class="light-rays"></div><div class="particles" id="particles"></div><div class="vignette"></div><div class="noise"></div>
<main class="hud">
<div class="topbar"><section class="brand"><div class="eyebrow"><i class="dot"></i> Interactive Simulation</div><h1>AQUA</h1><p class="subtitle">Boids · 群体智能 · Canvas 2D</p></section>
<aside class="panel" id="desktopPanel"><div class="panel-title">Simulation</div><div class="control"><label>Fish</label><input id="count" type="range" min="60" max="300" value="200"><span class="value" id="countValue">200</span></div><div class="control"><label>Speed</label><input id="speed" type="range" min="50" max="160" value="100"><span class="value" id="speedValue">1.0×</span></div><div class="control"><label>Attraction</label><input id="attraction" type="range" min="30" max="150" value="80"><span class="value" id="attractionValue">0.80</span></div><button id="reset">重新生成鱼群</button></aside></div>
<div class="mobile-controls"><button class="mobile-button" id="togglePanel">控制</button><button class="mobile-button" id="mobileReset">重置</button></div>
<div class="mobile-panel panel" id="mobilePanel"><div class="panel-title">Simulation</div><div class="control"><label>Fish</label><input id="mCount" type="range" min="60" max="180" value="100"><span class="value" id="mCountValue">100</span></div><div class="control"><label>Speed</label><input id="mSpeed" type="range" min="50" max="160" value="100"><span class="value" id="mSpeedValue">1.0×</span></div><div class="control"><label>Attraction</label><input id="mAttraction" type="range" min="30" max="150" value="80"><span class="value" id="mAttractionValue">0.80</span></div></div>
<div class="bottom"><div class="hint"><strong>移动指针</strong> 驱散鱼群　·　<strong>按住左键</strong> 聚拢鱼群</div><div class="stats"><div class="stat"><span>School</span><b id="fishStat">200</b></div><div class="stat"><span>FPS</span><b id="fpsStat">60</b></div><div class="stat"><span>Mode</span><b id="modeStat">WANDER</b></div></div></div></main>
<div class="touch-tip">触摸并拖动：驱散 · 长按：聚拢</div>
<script>
const canvas=document.getElementById('fishCanvas'),ctx=canvas.getContext('2d',{alpha:false});let width=0,height=0,dpr=1,fishArray=[],fishCount=200,speedMultiplier=1,attractionStrength=.8,lastTime=performance.now(),fps=60;const mouse={x:-1e3,y:-1e3,active:false,inside:false};const config={perceptionRadius:60,avoidanceRadius:25,mouseAvoidanceRadius:120};
function resize(){dpr=Math.min(devicePixelRatio||1,2);width=innerWidth;height=innerHeight;canvas.width=Math.floor(width*dpr);canvas.height=Math.floor(height*dpr);canvas.style.width=width+'px';canvas.style.height=height+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
function pointer(e){const p=e.touches?e.touches[0]:e;mouse.x=p.clientX;mouse.y=p.clientY;mouse.inside=true}addEventListener('resize',resize,{passive:true});addEventListener('mousemove',pointer,{passive:true});addEventListener('mouseleave',()=>{mouse.inside=false;mouse.active=false});addEventListener('mousedown',e=>{if(e.button===0)mouse.active=true});addEventListener('mouseup',()=>mouse.active=false);addEventListener('touchstart',e=>{pointer(e);mouse.active=e.touches.length>0},{passive:true});addEventListener('touchmove',e=>pointer(e),{passive:true});addEventListener('touchend',()=>{mouse.active=false;mouse.inside=false},{passive:true});addEventListener('blur',()=>mouse.active=false);resize();
function createAtmosphere(){const box=document.getElementById('particles'),frag=document.createDocumentFragment();for(let i=0;i<38;i++){const p=document.createElement('i');p.className='particle';p.style.left=Math.random()*100+'%';p.style.animationDuration=12+Math.random()*20+'s';p.style.animationDelay=-Math.random()*25+'s';p.style.opacity=(.15+Math.random()*.45).toFixed(2);const s=.7+Math.random()*1.8;p.style.width=s+'px';p.style.height=s+'px';frag.appendChild(p)}for(let i=0;i<6;i++){const b=document.createElement('i');b.className='bubble';b.style.left=(8+Math.random()*84)+'%';b.style.width=b.style.height=(3+Math.random()*9)+'px';b.style.animationDuration=16+Math.random()*18+'s';b.style.animationDelay=-Math.random()*20+'s';frag.appendChild(b)}box.appendChild(frag)}createAtmosphere();
class Fish{constructor(){this.reset()}reset(){this.x=Math.random()*width;this.y=Math.random()*height;const a=Math.random()*Math.PI*2,s=1.4+Math.random()*1.8;this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s;this.maxSpeed=2+Math.random()*2;this.color=`hsla(${185+Math.random()*50},85%,${62+Math.random()*18}%,${.5+Math.random()*.35})`;this.size=1.7+Math.random()*2.6;this.accX=this.accY=0}apply(fishes){let ax=0,ay=0,cx=0,cy=0,sx=0,sy=0,total=0;for(const o of fishes){if(o===this)continue;const dx=this.x-o.x,dy=this.y-o.y,d=Math.hypot(dx,dy);if(d>0&&d<config.perceptionRadius){ax+=o.vx;ay+=o.vy;cx+=o.x;cy+=o.y;if(d<config.avoidanceRadius){sx+=dx/d;sy+=dy/d}total++}}if(total){this.accX+=(ax/total-this.vx)*.045+(cx/total-this.x)*.0045+sx*.14;this.accY+=(ay/total-this.vy)*.045+(cy/total-this.y)*.0045+sy*.14}const dx=mouse.x-this.x,dy=mouse.y-this.y,d=Math.hypot(dx,dy);if(mouse.active&&d>8){const f=attractionStrength*Math.min(1,140/d);this.accX+=dx/d*f;this.accY+=dy/d*f;this.currentMaxSpeed=this.maxSpeed*1.55}else{if(mouse.inside&&d<config.mouseAvoidanceRadius&&d>0){const f=(1-d/config.mouseAvoidanceRadius)*.42;this.accX-=dx/d*f;this.accY-=dy/d*f}this.currentMaxSpeed=this.maxSpeed}}update(){this.vx+=this.accX*speedMultiplier;this.vy+=this.accY*speedMultiplier;const s=Math.hypot(this.vx,this.vy),m=this.currentMaxSpeed*speedMultiplier;if(s>m){this.vx=this.vx/s*m;this.vy=this.vy/s*m}this.x+=this.vx*speedMultiplier;this.y+=this.vy*speedMultiplier;this.accX=this.accY=0}edges(){if(this.x<-15)this.x=width+15;if(this.x>width+15)this.x=-15;if(this.y<-15)this.y=height+15;if(this.y>height+15)this.y=-15}draw(){ctx.save();ctx.translate(this.x,this.y);ctx.rotate(Math.atan2(this.vy,this.vx));const s=this.size;ctx.globalAlpha=.9;ctx.fillStyle=this.color;ctx.beginPath();ctx.moveTo(s*3.3,0);ctx.lineTo(-s*1.8,-s*1.5);ctx.lineTo(-s*.8,0);ctx.lineTo(-s*1.8,s*1.5);ctx.closePath();ctx.fill();ctx.restore()}}
function createFish(){fishArray=Array.from({length:fishCount},()=>new Fish());document.getElementById('fishStat').textContent=fishCount}createFish();
function bind(id,fn){document.getElementById(id).addEventListener('input',fn)}bind('count',e=>{fishCount=+e.target.value;document.getElementById('countValue').textContent=fishCount;createFish()});bind('speed',e=>{speedMultiplier=+e.target.value/100;document.getElementById('speedValue').textContent=speedMultiplier.toFixed(1)+'×'});bind('attraction',e=>{attractionStrength=+e.target.value/100;document.getElementById('attractionValue').textContent=attractionStrength.toFixed(2)});document.getElementById('reset').onclick=createFish;
function syncMobile(){fishCount=+mCount.value;speedMultiplier=+mSpeed.value/100;attractionStrength=+mAttraction.value/100;mCountValue.textContent=fishCount;mSpeedValue.textContent=speedMultiplier.toFixed(1)+'×';mAttractionValue.textContent=attractionStrength.toFixed(2);createFish()}for(const [id,fn] of [['mCount',syncMobile],['mSpeed',syncMobile],['mAttraction',syncMobile]])document.getElementById(id).addEventListener('input',fn);mobileReset.onclick=createFish;togglePanel.onclick=()=>mobilePanel.classList.toggle('open');
let frames=0,fpsTime=performance.now();function animate(now){const dt=now-lastTime;lastTime=now;frames++;if(now-fpsTime>500){fps=Math.round(frames*1000/(now-fpsTime));frames=0;fpsTime=now;fpsStat.textContent=fps}ctx.fillStyle='#06121f';ctx.fillRect(0,0,width,height);if(mouse.active){ctx.beginPath();ctx.arc(mouse.x,mouse.y,48,0,Math.PI*2);ctx.fillStyle='rgba(101,232,255,.07)';ctx.fill();ctx.strokeStyle='rgba(101,232,255,.24)';ctx.stroke()}for(const f of fishArray){f.apply(fishArray);f.update();f.edges();f.draw()}modeStat.textContent=mouse.active?'ATTRACT':mouse.inside?'AVOID':'WANDER';requestAnimationFrame(animate)}requestAnimationFrame(animate);
</script>
</body></html>
