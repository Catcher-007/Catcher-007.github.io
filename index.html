<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06121f"><title>AQUA — 灵动鱼群</title><style>:root{--bg:#06121f;--cyan:#65e8ff;--text:#edf9ff;--muted:#8ba9bb;--panel:rgba(8,24,40,.68)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);touch-action:none}body{color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:none}.bg,.rays,.particles,.vignette{position:fixed;inset:0;pointer-events:none}.bg{background:radial-gradient(ellipse at 50% 110%,#123d55 0,transparent 48%),radial-gradient(circle at 15% 25%,#0b2942,transparent 42%);animation:bg 16s ease-in-out infinite alternate}.rays{opacity:.16;background:linear-gradient(115deg,transparent 38%,rgba(120,225,255,.08) 45%,transparent 53%),linear-gradient(70deg,transparent 58%,rgba(120,225,255,.05) 66%,transparent 74%);animation:rays 20s ease-in-out infinite alternate}.vignette{background:radial-gradient(circle at 70% 20%,rgba(36,156,210,.1),transparent 32%),linear-gradient(180deg,transparent 35%,rgba(1,8,15,.55))}.hud{position:fixed;inset:0;padding:28px;z-index:5;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}.brand,.panel,.stats,.hint{background:var(--panel);border:1px solid rgba(170,225,255,.14);box-shadow:0 24px 70px #0006;backdrop-filter:blur(18px)}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.brand{padding:18px 20px;border-radius:18px}.eyebrow{color:var(--cyan);font-size:11px;font-weight:700;letter-spacing:.18em}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 14px var(--cyan);margin-right:8px}h1{margin:8px 0 3px;font-size:clamp(26px,3vw,38px);line-height:1}.sub{margin:0;color:var(--muted);font-size:12px}.panel{width:290px;padding:16px;border-radius:18px;pointer-events:auto}.title{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.14em;margin-bottom:10px}.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #ffffff0d}.row:first-of-type{border:0}.row label{flex:1;color:#c5dbe7;font-size:13px}input{width:105px;accent-color:var(--cyan)}.val{width:38px;text-align:right;color:var(--cyan);font-size:12px}button{width:100%;margin-top:8px;padding:10px;border:1px solid #65e8ff2e;border-radius:10px;background:#65e8ff0d;color:var(--text)}.bottom{display:flex;justify-content:space-between;align-items:end;gap:18px}.hint{padding:13px 16px;border-radius:14px;color:#b9d2df;font-size:12px}.stats{display:flex;gap:20px;padding:13px 16px;border-radius:14px}.stat span{display:block;color:var(--muted);font-size:9px;letter-spacing:.12em}.stat b{font-size:14px}.mobile{display:none}@keyframes bg{to{transform:scale(1.06) translate3d(1%,-1%,0)}}@keyframes rays{to{transform:translateX(4%) rotate(1deg)}}@keyframes float{from{transform:translateY(110vh);opacity:0}15%{opacity:.45}to{transform:translate(25px,-10vh);opacity:0}}@media(max-width:700px){.hud{padding:12px;padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom))}.brand{padding:12px 14px;border-radius:15px}.eyebrow{font-size:9px}h1{font-size:26px}.sub{font-size:10px}.panel{display:none}.mobile{display:flex;position:fixed;right:12px;top:max(12px,env(safe-area-inset-top));gap:7px;pointer-events:auto}.mobile button{width:auto;margin:0;padding:9px 13px;border-radius:999px}.bottom{display:flex}.hint{display:none}.stats{width:100%;justify-content:space-between;padding:9px 11px;gap:12px}.stat span{font-size:8px}.stat b{font-size:12px}.mpanel{position:fixed;left:12px;right:12px;bottom:62px;padding:14px;border-radius:16px;display:none;pointer-events:auto}.mpanel.open{display:block}.touch{display:block;position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom));transform:translateX(-50%);white-space:nowrap;padding:8px 12px;border:1px solid #ffffff1c;border-radius:999px;background:#08182899;color:#b9d2df;font-size:10px}}@media(min-width:701px){.touch,.mpanel{display:none!important}}@media(max-width:700px){.bg{animation:none}.rays{opacity:.09;animation:none}.particles{opacity:.65}.hud .brand,.hud .stats{backdrop-filter:blur(10px)}}@media(prefers-reduced-motion:reduce){.bg,.rays{animation:none}.particle{animation:none}}</style></head><body><canvas id="c"></canvas><div class="bg"></div><div class="rays"></div><div class="particles" id="p"></div><div class="vignette"></div><main class="hud"><div class="top"><section class="brand"><div class="eyebrow"><i class="dot"></i>INTERACTIVE SIMULATION</div><h1>AQUA</h1><p class="sub">Boids · 群体智能 · Canvas 2D</p></section><aside class="panel"><div class="title">SIMULATION</div><div class="row"><label>Fish</label><input id="count" type="range" min="60" max="300" value="200"><span class="val" id="cv">200</span></div><div class="row"><label>Speed</label><input id="speed" type="range" min="50" max="160" value="100"><span class="val" id="sv">1.0×</span></div><div class="row"><label>Attraction</label><input id="attr" type="range" min="30" max="150" value="80"><span class="val" id="av">0.80</span></div><button id="reset">重新生成鱼群</button></aside></div><div class="mobile"><button id="toggle">控制</button><button id="mreset">重置</button></div><div class="mpanel panel" id="mp"><div class="title">SIMULATION</div><div class="row"><label>Fish</label><input id="mc" type="range" min="50" max="120" value="70"><span class="val" id="mcv">70</span></div><div class="row"><label>Speed</label><input id="ms" type="range" min="50" max="160" value="100"><span class="val" id="msv">1.0×</span></div><div class="row"><label>Attraction</label><input id="ma" type="range" min="30" max="150" value="80"><span class="val" id="mav">0.80</span></div></div><div class="bottom"><div class="hint"><b>移动指针</b> 水流扰动　·　<b>按住左键</b> 聚拢</div><div class="stats"><div class="stat"><span>SCHOOL</span><b id="fs">200</b></div><div class="stat"><span>FPS</span><b id="fps">60</b></div><div class="stat"><span>MODE</span><b id="mode">WANDER</b></div></div></div></main><div class="touch">触摸拖动：产生水流 · 长按：聚拢</div><script>const c=document.getElementById('c'),x=c.getContext('2d',{alpha:false});let W,H,D,fish=[],renderOrder=[],grid=new Map,N=200,spd=1,att=.8,frames=0,ft=0,flow=[],lastPointer={x:0,y:0,t:0};const CELL=60,NEIGHBOR2=3600,mobileDevice=matchMedia('(max-width:700px)').matches,m={x:-1e3,y:-1e3,on:false,inside:false};function resize(){D=Math.min(devicePixelRatio||1,mobileDevice?1.35:2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize,{passive:true});function point(e){const q=e.touches?e.touches[0]:e,now=performance.now();if(lastPointer.t){const dt=Math.max(8,now-lastPointer.t),dx=q.clientX-lastPointer.x,dy=q.clientY-lastPointer.y,v=Math.hypot(dx,dy)/(dt/16);if(v>1.1)flow.push({x:q.clientX,y:q.clientY,vx:dx/16,vy:dy/16,p:Math.min(2.4,v*.38),life:1})}lastPointer={x:q.clientX,y:q.clientY,t:now};m.x=q.clientX;m.y=q.clientY;m.inside=true}addEventListener('mousemove',point,{passive:true});addEventListener('mousedown',e=>e.button===0&&(m.on=true));addEventListener('mouseup',()=>m.on=false);addEventListener('mouseleave',()=>{m.inside=false;m.on=false});addEventListener('touchstart',e=>{lastPointer.t=0;point(e);m.on=true},{passive:true});addEventListener('touchmove',point,{passive:true});addEventListener('touchend',()=>{m.on=false;m.inside=false;lastPointer.t=0},{passive:true});addEventListener('blur',()=>m.on=false);resize();const ps=document.getElementById('p');for(let i=0;i<(mobileDevice?18:36);i++){const q=document.createElement('i');q.className='particle';q.style.cssText=`position:absolute;left:${Math.random()*100}%;width:${.7+Math.random()*1.8}px;height:${.7+Math.random()*1.8}px;border-radius:50%;background:#b1ebff88;animation:float ${12+Math.random()*20}s linear ${-Math.random()*20}s infinite`;ps.append(q)}function key(a,b){return a+','+b}function rebuildGrid(){grid.clear();for(const f of fish){const gx=(f.x/CELL)|0,gy=(f.y/CELL)|0,k=key(gx,gy),a=grid.get(k);if(a)a.push(f);else grid.set(k,[f])}}function neighbors(f,fn){const gx=(f.x/CELL)|0,gy=(f.y/CELL)|0;for(let iy=-1;iy<=1;iy++)for(let ix=-1;ix<=1;ix++){const a=grid.get(key(gx+ix,gy+iy));if(a)for(const o of a)if(o!==f)fn(o)}}class Fish{constructor(){this.reset()}reset(){this.x=Math.random()*W;this.y=Math.random()*H;const a=Math.random()*6.28,s=1.4+Math.random()*1.8;this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s;this.max=2+Math.random()*2;this.depth=Math.random();this.size=1.7+Math.random()*2.6;this.h=185+Math.random()*50;this.accx=this.accy=0;this.tail=0;this.phase=Math.random()*6.28;this.tailSpeed=.11+Math.random()*.08}behave(){let ax=0,ay=0,cx=0,cy=0,sx=0,sy=0,n=0;neighbors(this,o=>{const dx=this.x-o.x,dy=this.y-o.y,d2=dx*dx+dy*dy;if(d2>0&&d2<NEIGHBOR2){const d=Math.sqrt(d2);ax+=o.vx;ay+=o.vy;cx+=o.x;cy+=o.y;if(d<25){sx+=dx/d;sy+=dy/d}n++}});if(n){this.accx+=(ax/n-this.vx)*.045+(cx/n-this.x)*.0045+sx*.14;this.accy+=(ay/n-this.vy)*.045+(cy/n-this.y)*.0045+sy*.14}const dx=m.x-this.x,dy=m.y-this.y,d2=dx*dx+dy*dy;if(m.on&&d2>64){const d=Math.sqrt(d2),f=att*Math.min(1,140/d);this.accx+=dx/d*f;this.accy+=dy/d*f;this.limit=this.max*1.55}else{if(m.inside&&d2<14400&&d2>0){const d=Math.sqrt(d2),f=(1-d/120)*.42;this.accx-=dx/d*f;this.accy-=dy/d*f}this.limit=this.max}for(const q of flow){const fx=this.x-q.x,fy=this.y-q.y,d2f=fx*fx+fy*fy;if(d2f<14400){const d=Math.sqrt(d2f)||1,fall=1-d/120;this.accx+=q.vx*q.p*fall*.055;this.accy+=q.vy*q.p*fall*.055}}}update(){const depthSpeed=.68+this.depth*.48;this.vx+=this.accx*spd*depthSpeed;this.vy+=this.accy*spd*depthSpeed;const s=Math.hypot(this.vx,this.vy),lim=this.limit*spd*depthSpeed;if(s>lim){this.vx=this.vx/s*lim;this.vy=this.vy/s*lim}this.x+=this.vx*depthSpeed;this.y+=this.vy*depthSpeed;this.accx=this.accy=0;this.phase+=this.tailSpeed*(.7+s*.08);this.tail=Math.sin(this.phase)*Math.min(.22,s/3.5)}edge(){if(this.x<-20)this.x=W+20;if(this.x>W+20)this.x=-20;if(this.y<-20)this.y=H+20;if(this.y>H+20)this.y=-20}draw(){const z=.62+this.depth*.82,s=this.size*z,a=.12+this.depth*.78,w=this.tail;x.save();x.translate(this.x,this.y);x.rotate(Math.atan2(this.vy,this.vx));x.globalAlpha=a;if(!mobileDevice){const b=(1-this.depth)*1.8;x.filter=b>.2?`blur(${b}px)`:'none'}x.fillStyle=`hsl(${this.h} 82% ${58+this.depth*18}%)`;x.beginPath();x.moveTo(s*2.55,0);x.bezierCurveTo(s*1.25,-s*.48,-s*.15,-s*.72,-s*.82,-s*.32);x.bezierCurveTo(-s*1.15,-s*(.7+w),-s*1.5,-s*(.72+w),-s*1.7,-s*(.38+w));x.quadraticCurveTo(-s*1.05,0,-s*1.7,s*(.38-w));x.bezierCurveTo(-s*1.5,s*(.72-w),-s*1.15,s*(.7-w),-s*.82,s*.32);x.bezierCurveTo(-s*.15,s*.72,s*1.25,s*.48,s*2.55,0);x.closePath();x.fill();x.globalAlpha=a*.55;x.fillStyle='#d9fbff';x.beginPath();x.arc(s*1.35,-s*.18,s*.11,0,6.28);x.fill();x.restore()}}function make(){fish=Array.from({length:N},()=>new Fish());renderOrder=fish.slice().sort((a,b)=>a.depth-b.depth);fs.textContent=N}make();function bind(id,fn){document.getElementById(id).oninput=fn}bind('count',e=>{N=+e.target.value;cv.textContent=N;make()});bind('speed',e=>{spd=+e.target.value/100;sv.textContent=spd.toFixed(1)+'×'});bind('attr',e=>{att=+e.target.value/100;av.textContent=att.toFixed(2)});reset.onclick=make;function mobile(){N=+mc.value;spd=+ms.value/100;att=+ma.value/100;mcv.textContent=N;msv.textContent=spd.toFixed(1)+'×';mav.textContent=att.toFixed(2);make()}mc.oninput=ms.oninput=ma.oninput=mobile;mreset.onclick=make;toggle.onclick=()=>mp.classList.toggle('open');function loop(t){frames++;if(t-ft>500){fps.textContent=Math.round(frames*1000/(t-ft));frames=0;ft=t}x.fillStyle='#06121f';x.fillRect(0,0,W,H);rebuildGrid();for(const f of fish){f.behave();f.update();f.edge()}const maxFlow=mobileDevice?12:24;for(let i=flow.length-1;i>=0;i--){flow[i].life-=mobileDevice?.045:.03;if(flow[i].life<=0)flow.splice(i,1)}if(flow.length>maxFlow)flow.splice(0,flow.length-maxFlow);for(const f of renderOrder)f.draw();if(flow.length){x.save();x.globalAlpha=mobileDevice?.08:.12;for(const q of flow){const r=8+q.p*6*(1-q.life*.5);x.beginPath();x.arc(q.x,q.y,r,0,6.28);x.strokeStyle='#65e8ff';x.stroke()}x.restore()}mode.textContent=m.on?'ATTRACT':flow.length?'FLOW':m.inside?'AVOID':'WANDER';requestAnimationFrame(loop)}requestAnimationFrame(loop)</script></body></html>
