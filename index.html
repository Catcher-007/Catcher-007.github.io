<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>灵动鱼群 - 点击吸引模式</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            cursor: crosshair;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.8);
            font-family: "Microsoft YaHei", sans-serif;
            pointer-events: none;
            user-select: none;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h1>深海鱼群</h1>
        <p>移动：驱散鱼儿</p>
        <p><strong>按住鼠标左键：吸引鱼群聚拢</strong></p>
    </div>
    <canvas id="fishCanvas"></canvas>

    <script>
        const canvas = document.getElementById('fishCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        const fishArray = [];
        const numFish = 200; 
        const mouse = { x: -1000, y: -1000, active: false };

        // 基础配置
        const config = {
            maxSpeed: 3,
            perceptionRadius: 60,
            avoidanceRadius: 25,
            mouseAvoidanceRadius: 120,
            attractionStrength: 0.8 // 吸引力强度
        };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        // 鼠标事件监听
        window.addEventListener('resize', resize);
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        window.addEventListener('mousedown', () => { mouse.active = true; });
        window.addEventListener('mouseup', () => { mouse.active = false; });

        resize();

        class Fish {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 6;
                this.vy = (Math.random() - 0.5) * 6;
                this.accX = 0;
                this.accY = 0;
                this.maxSpeed = 2 + Math.random() * 3;
                // 颜色稍微带点透明感
                this.color = `hsla(${190 + Math.random() * 40}, 80%, 60%, 0.8)`;
                this.size = 2 + Math.random() * 3;
            }

            edges() {
                if (this.x > width) this.x = 0;
                else if (this.x < 0) this.x = width;
                if (this.y > height) this.y = 0;
                else if (this.y < 0) this.y = height;
            }

            applyBehaviors(fishes) {
                let alignment = { x: 0, y: 0 };
                let cohesion = { x: 0, y: 0 };
                let separation = { x: 0, y: 0 };
                let total = 0;

                for (let other of fishes) {
                    let d = Math.hypot(this.x - other.x, this.y - other.y);
                    if (other !== this && d < config.perceptionRadius) {
                        alignment.x += other.vx;
                        alignment.y += other.vy;
                        cohesion.x += other.x;
                        cohesion.y += other.y;
                        
                        if (d < config.avoidanceRadius) {
                            separation.x += (this.x - other.x) / d;
                            separation.y += (this.y - other.y) / d;
                        }
                        total++;
                    }
                }

                if (total > 0) {
                    alignment.x /= total; alignment.y /= total;
                    this.accX += (alignment.x - this.vx) * 0.05;
                    this.accY += (alignment.y - this.vy) * 0.05;

                    cohesion.x /= total; cohesion.y /= total;
                    this.accX += (cohesion.x - this.x) * 0.005;
                    this.accY += (cohesion.y - this.y) * 0.005;

                    this.accX += separation.x * 0.15;
                    this.accY += separation.y * 0.15;
                }

                // --- 交互逻辑 ---
                let distToMouse = Math.hypot(this.x - mouse.x, this.y - mouse.y);
                
                if (mouse.active) {
                    // 吸引模式：向鼠标位置加速
                    let forceX = (mouse.x - this.x) / distToMouse;
                    let forceY = (mouse.y - this.y) / distToMouse;
                    this.accX += forceX * config.attractionStrength;
                    this.accY += forceY * config.attractionStrength;
                    // 吸引时鱼会变得稍微快一点
                    this.currentMaxSpeed = this.maxSpeed * 1.5;
                } else {
                    // 逃逸模式：平时躲避鼠标
                    if (distToMouse < config.mouseAvoidanceRadius) {
                        this.accX += (this.x - mouse.x) * 0.03;
                        this.accY += (this.y - mouse.y) * 0.03;
                    }
                    this.currentMaxSpeed = this.maxSpeed;
                }
            }

            update() {
                this.vx += this.accX;
                this.vy += this.accY;

                const speed = Math.hypot(this.vx, this.vy);
                if (speed > this.currentMaxSpeed) {
                    this.vx = (this.vx / speed) * this.currentMaxSpeed;
                    this.vy = (this.vy / speed) * this.currentMaxSpeed;
                }

                this.x += this.vx;
                this.y += this.vy;
                this.accX = 0;
                this.accY = 0;
            }

            draw() {
                const angle = Math.atan2(this.vy, this.vx);
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(angle);

                // 鱼身
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.moveTo(this.size * 2.5, 0);
                ctx.lineTo(-this.size * 2, -this.size * 1.5);
                ctx.lineTo(-this.size, 0);
                ctx.lineTo(-this.size * 2, this.size * 1.5);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }
        }

        // 初始化
        for (let i = 0; i < numFish; i++) {
            fishArray.push(new Fish());
        }

        function animate() {
            // 背景底色
            ctx.fillStyle = 'rgba(5, 15, 25, 0.25)';
            ctx.fillRect(0, 0, width, height);

            // 如果正在点击，画一个淡淡的吸引力圆圈
            if (mouse.active) {
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, 50, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 255, 255, 0.1)';
                ctx.fill();
                ctx.strokeStyle = 'rgba(0, 255, 255, 0.2)';
                ctx.stroke();
            }

            for (let fish of fishArray) {
                fish.applyBehaviors(fishArray);
                fish.update();
                fish.edges();
                fish.draw();
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
