<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06121f"><title>AQUA — 灵动鱼群</title><style>:root{--bg:#06121f;--cyan:#65e8ff;--text:#edf9ff;--muted:#8ba9bb;--panel:rgba(8,24,40,.68)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);touch-action:none}body{color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:none}.bg,.rays,.particles,.vignette{position:fixed;inset:0;pointer-events:none}.bg{background:radial-gradient(ellipse at 50% 110%,#123d55 0,transparent 48%),radial-gradient(circle at 15% 25%,#0b2942,transparent 42%)}.rays{opacity:.13;background:linear-gradient(115deg,transparent 38%,rgba(120,225,255,.08) 45%,transparent 53%),linear-gradient(70deg,transparent 58%,rgba(120,225,255,.05) 66%,transparent 74%)}.vignette{background:radial-gradient(circle at 70% 20%,rgba(36,156,210,.1),transparent 32%),linear-gradient(180deg,transparent 35%,rgba(1,8,15,.55))}.hud{position:fixed;inset:0;padding:28px;z-index:5;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}.brand,.panel,.stats,.hint{background:var(--panel);border:1px solid rgba(170,225,255,.14);box-shadow:0 24px 70px #0006;backdrop-filter:blur(14px)}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.brand{padding:18px 20px;border-radius:18px}.eyebrow{color:var(--cyan);font-size:11px;font-weight:700;letter-spacing:.18em}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 14px var(--cyan);margin-right:8px}h1{margin:8px 0 3px;font-size:clamp(26px,3vw,38px);line-height:1}.sub{margin:0;color:var(--muted);font-size:12px}.panel{width:290px;padding:16px;border-radius:18px;pointer-events:auto}.title{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.14em;margin-bottom:10px}.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #ffffff0d}.row:first-of-type{border:0}.row label{flex:1;color:#c5dbe7;font-size:13px}.row label:hover{color:#fff}input{width:105px;accent-color:var(--cyan)}.val{width:38px;text-align:right;color:var(--cyan);font-size:12px}button{width:100%;margin-top:8px;padding:10px;border:1px solid #65e8ff2e;border-radius:10px;background:#65e8ff0d;color:var(--text)}button:hover{background:#65e8ff18}.tip{position:fixed;z-index:20;display:none;width:220px;padding:10px 12px;border:1px solid #65e8ff26;border-radius:11px;background:#071b2bcc;box-shadow:0 14px 35px #0006;color:#b9d2df;font-size:11px;line-height:1.45;pointer-events:none}.tip b{display:block;color:#65e8ff;margin-bottom:3px}.bottom{display:flex;justify-content:space-between;align-items:end;gap:18px}.hint{padding:13px 16px;border-radius:14px;color:#b9d2df;font-size:12px}.stats{display:flex;gap:20px;padding:13px 16px;border-radius:14px}.stat span{display:block;color:var(--muted);font-size:9px;letter-spacing:.12em}.stat b{font-size:14px}.mobile{display:none}@media(max-width:700px){.hud{padding:12px;padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom))}.brand{padding:12px 14px;border-radius:15px}.eyebrow{font-size:9px}h1{font-size:26px}.sub{font-size:10px}.panel{display:none}.mobile{display:flex;position:fixed;right:12px;top:max(12px,env(safe-area-inset-top));gap:7px;pointer-events:auto}.mobile button{width:auto;margin:0;padding:9px 13px;border-radius:999px}.bottom{display:flex}.hint{display:none}.stats{width:100%;justify-content:space-between;padding:9px 11px;gap:12px}.stat span{font-size:8px}.stat b{font-size:12px}.mpanel{position:fixed;left:12px;right:12px;bottom:62px;padding:14px;border-radius:16px;display:none;pointer-events:auto}.mpanel.open{display:block}.touch{display:block;position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom));transform:translateX(-50%);white-space:nowrap;padding:8px 12px;border:1px solid #ffffff1c;border-radius:999px;background:#08182899;color:#b9d2df;font-size:10px}}@media(min-width:701px){.touch,.mpanel{display:none!important}}@media(max-width:700px){.bg,.rays{animation:none}.rays{opacity:.08}.particles{opacity:.55}.hud .brand,.hud .stats{backdrop-filter:blur(9px)}}@media(prefers-reduced-motion:reduce){.bg,.rays{animation:none}} </style></head><body><canvas id="c"></canvas><div class="bg"></div><div class="rays"></div><div class="particles" id="p"></div><div class="vignette"></div><main class="hud"><div class="top"><section class="brand"><div class="eyebrow"><i class="dot"></i>INTERACTIVE SIMULATION</div><h1>AQUA</h1><p class="sub">Boids · 群体智能 · Canvas 2D</p></section><aside class="panel"><div class="title">SIMULATION</div><div class="row" data-tip="Fish" data-text="鱼群数量。数量越高，鱼群越密集，也会增加计算量。"><label>Fish</label><input id="count" type="range" min="60" max="300" value="180"><span class="val" id="cv">180</span></div><div class="row" data-tip="Speed" data-text="鱼群整体游动速度。数值越高，运动越活跃。"><label>Speed</label><input id="speed" type="range" min="50" max="160" value="95"><span class="val" id="sv">1.0×</span></div><div class="row" data-tip="Attraction" data-text="按住鼠标时的聚拢力度。越高，鱼群越快向指针靠近。"><label>Attraction</label><input id="attr" type="range" min="30" max="150" value="70"><span class="val" id="av">0.70</span></div><button id="reset">重新生成鱼群</button></aside></div><div class="mobile"><button id="toggle">控制</button><button id="mreset">重置</button></div><div class="mpanel panel" id="mp"><div class="title">SIMULATION</div><div class="row" data-tip="Fish" data-text="鱼群数量。数量越高，鱼群越密集，也会增加计算量。"><label>Fish</label><input id="mc" type="range" min="50" max="120" value="80"><span class="val" id="mcv">80</span></div><div class="row" data-tip="Speed" data-text="鱼群整体游动速度。数值越高，运动越活跃。"><label>Speed</label><input id="ms" type="range" min="50" max="160" value="80"><span class="val" id="msv">0.8×</span></div><div class="row" data-tip="Attraction" data-text="按住屏幕时的聚拢力度。越高，鱼群越快靠近触点。"><label>Attraction</label><input id="ma" type="range" min="30" max="150" value="60"><span class="val" id="mav">0.60</span></div></div><div class="bottom"><div class="hint"><b>移动指针</b> 水流　·　<b>按住左键</b> 聚拢　·　<b>点击</b> 水波</div><div class="stats"><div class="stat"><span>SCHOOL</span><b id="fs">180</b></div><div class="stat"><span>FPS</span><b id="fps">60</b></div><div class="stat"><span>MODE</span><b id="mode">WANDER</b></div></div></div></main><div class="touch">触摸拖动：水流与波纹 · 长按：聚拢</div><div class="tip" id="tip"><b></b><span></span></div><script>const c=document.getElementById('c'),ctx=c.getContext('2d',{alpha:false}),mobile=matchMedia('(max-width:700px)').matches;let W=innerWidth,H=innerHeight,D,fish=[],grid=new Map(),flowGrid=new Map(),ripples=[],flows=[],N=mobile?80:180,spd=mobile?.8:.95,att=mobile?.6:.7,quality=1,frames=0,fpsTime=performance.now(),fps=60,last=performance.now(),acc=0;const CELL=64,NEAR=64,NEAR2=NEAR*NEAR,flowCell=96,flowR=125,m={x:-1e4,y:-1e4,on:false,inside:false},pointer={x:0,y:0,t:0};function resize(){D=Math.min(devicePixelRatio||1,mobile?1.25:1.5)*quality;W=innerWidth;H=innerHeight;c.width=Math.max(1,W*D);c.height=Math.max(1,H*D);ctx.setTransform(D,0,0,D,0,0)}function cellKey(x,y){return ((x/CELL)|0)+','+((y/CELL)|0)}function flowKey(x,y){return ((x/flowCell)|0)+','+((y/flowCell)|0)}function rebuildFishGrid(){grid.clear();for(const f of fish){const k=cellKey(f.x,f.y),a=grid.get(k);a?a.push(f):grid.set(k,[f])}}function rebuildFlowGrid(){flowGrid.clear();for(const q of flows){const k=flowKey(q.x,q.y),a=flowGrid.get(k);a?a.push(q):flowGrid.set(k,[q])}}function eachNeighbor(f,fn){const gx=(f.x/CELL)|0,gy=(f.y/CELL)|0;for(let y=-1;y<=1;y++)for(let z=-1;z<=1;z++){const a=grid.get((gx+z)+','+(gy+y));if(a)for(const o of a)if(o!==f)fn(o)}}function eachFlow(f,fn){const gx=(f.x/flowCell)|0,gy=(f.y/flowCell)|0;for(let y=-1;y<=1;y++)for(let z=-1;z<=1;z++){const a=flowGrid.get((gx+z)+','+(gy+y));if(a)for(const q of a)fn(q)}}function eachRipple(f,fn){for(const r of ripples){const dx=f.x-r.x,dy=f.y-r.y;if(dx*dx+dy*dy<(r.r+48)*(r.r+48))fn(r)}}class Fish{constructor(){this.reset()}reset(){this.x=Math.random()*W;this.y=Math.random()*H;const a=Math.random()*6.283,s=1.2+Math.random()*1.7;this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s;this.max=1.8+Math.random()*1.8;this.depth=Math.random();this.size=1.8+Math.random()*2.2;this.h=185+Math.random()*45;this.phase=Math.random()*6.283;this.tail=.0;this.tailSpeed=.11+Math.random()*.08}step(dt){let ax=0,ay=0,cx=0,cy=0,sx=0,sy=0,n=0;eachNeighbor(this,o=>{const dx=this.x-o.x,dy=this.y-o.y,d2=dx*dx+dy*dy;if(d2>0&&d2<NEAR2){const d=Math.sqrt(d2);ax+=o.vx;ay+=o.vy;cx+=o.x;cy+=o.y;if(d<24){sx+=dx/d;sy+=dy/d}n++}});if(n){this.ax=(ax/n-this.vx)*.04+(cx/n-this.x)*.004+sx*.13;this.ay=(ay/n-this.vy)*.04+(cy/n-this.y)*.004+sy*.13}else this.ax=this.ay=0;const dx=m.x-this.x,dy=m.y-this.y,d2=dx*dx+dy*dy;if(m.on&&d2>64){const d=Math.sqrt(d2),f=att*Math.min(1,140/d);this.ax+=dx/d*f;this.ay+=dy/d*f;this.limit=this.max*1.5}else{if(m.inside&&d2<14400&&d2>0){const d=Math.sqrt(d2),f=(1-d/120)*.35;this.ax-=dx/d*f;this.ay-=dy/d*f}this.limit=this.max}eachFlow(this,q=>{const dx=this.x-q.x,dy=this.y-q.y,d2=dx*dx+dy*dy;if(d2<flowR*flowR){const d=Math.sqrt(d2)||1,fall=1-d/flowR;this.ax+=q.vx*q.p*fall*.045;this.ay+=q.vy*q.p*fall*.045}});eachRipple(this,r=>{const dx=this.x-r.x,dy=this.y-r.y,d=Math.sqrt(dx*dx+dy*dy)||1,ring=Math.abs(d-r.r);if(ring<36){const fall=(1-ring/36)*r.power*.012;this.ax+=dx/d*fall;this.ay+=dy/d*fall}});const ds=.7+this.depth*.42;this.vx+=this.ax*spd*ds*dt;this.vy+=this.ay*spd*ds*dt;const s=Math.hypot(this.vx,this.vy),lim=this.limit*spd*ds;if(s>lim){this.vx=this.vx/s*lim;this.vy=this.vy/s*lim}this.x+=this.vx*ds*dt;this.y+=this.vy*ds*dt;this.phase+=this.tailSpeed*(.8+s*.06)*dt;this.tail=Math.sin(this.phase)*Math.min(.28,s/3.4);if(this.x<-24)this.x=W+24;else if(this.x>W+24)this.x=-24;if(this.y<-24)this.y=H+24;else if(this.y>H+24)this.y=-24}draw(){const z=.68+this.depth*.7,s=this.size*z,a=Math.min(.92,.2+this.depth*.72),t=this.tail,ang=Math.atan2(this.vy,this.vx),cs=Math.cos(ang),sn=Math.sin(ang),px=this.x,py=this.y;const pts=[[3.1*s,0],[-.45*s,-.7*s],[-1.55*s,-(1.25+t)*s],[-.85*s,0],[-1.55*s,(1.25-t)*s],[-.45*s,.7*s]];ctx.globalAlpha=a;ctx.fillStyle=this.depth>.72?'#8eefff':this.depth>.38?'#62dff5':'#48b9d6';ctx.beginPath();for(let i=0;i<pts.length;i++){const X=px+pts[i][0]*cs-pts[i][1]*sn,Y=py+pts[i][0]*sn+pts[i][1]*cs;i?ctx.lineTo(X,Y):ctx.moveTo(X,Y)}ctx.closePath();ctx.fill()}}function make(){fish=Array.from({length:N},()=>new Fish());fs.textContent=N}function addFlow(px,py,vx,vy){flows.push({x:px,y:py,vx,vy,p:Math.min(2.2,Math.hypot(vx,vy)*.42),life:1});if(flows.length>(mobile?8:18))flows.shift()}function ripple(px,py,power=.8){ripples.push({x:px,y:py,r:5,life:1,power});if(ripples.length>(mobile?4:7))ripples.shift()}function pointer(e){const q=e.touches?e.touches[0]:e,now=performance.now();if(pointer.last){const dt=Math.max(8,now-pointer.last.t),dx=q.clientX-pointer.last.x,dy=q.clientY-pointer.last.y,v=Math.hypot(dx,dy)/(dt/16);if(v>1)addFlow(q.clientX,q.clientY,dx/16,dy/16)}pointer.last={x:q.clientX,y:q.clientY,t:now};m.x=q.clientX;m.y=q.clientY;m.inside=true}addEventListener('mousemove',pointer,{passive:true});addEventListener('mousedown',e=>{if(e.button===0){m.on=true;ripple(e.clientX,e.clientY,1)}});addEventListener('mouseup',()=>m.on=false);addEventListener('mouseleave',()=>{m.inside=false;m.on=false});addEventListener('click',e=>{if(e.target===c)ripple(e.clientX,e.clientY,.75)});addEventListener('touchstart',e=>{pointer.last=null;pointer(e);m.on=true;ripple(e.touches[0].clientX,e.touches[0].clientY,1)},{passive:true});addEventListener('touchmove',pointer,{passive:true});addEventListener('touchend',()=>{m.on=false;m.inside=false;pointer.last=null},{passive:true});addEventListener('resize',resize,{passive:true});addEventListener('blur',()=>m.on=false);const ps=document.getElementById('p');for(let i=0;i<(mobile?10:18);i++){const q=document.createElement('i');q.style.cssText=`position:absolute;left:${Math.random()*100}%;width:1px;height:1px;border-radius:50%;background:#b1ebff66`;ps.append(q)}function setN(v){N=+v;make()}count.oninput=e=>{setN(e.target.value);cv.textContent=N};speed.oninput=e=>{spd=+e.target.value/100;sv.textContent=spd.toFixed(1)+'×'};attr.oninput=e=>{att=+e.target.value/100;av.textContent=att.toFixed(2)};reset.onclick=()=>make();function syncMobile(){N=+mc.value;spd=+ms.value/100;att=+ma.value/100;mcv.textContent=N;msv.textContent=spd.toFixed(1)+'×';mav.textContent=att.toFixed(2);make()}mc.oninput=ms.oninput=ma.oninput=syncMobile;mreset.onclick=()=>make();toggle.onclick=()=>mp.classList.toggle('open');const tip=document.getElementById('tip');document.querySelectorAll('[data-tip]').forEach(row=>{row.addEventListener('mouseenter',()=>{if(mobile)return;tip.querySelector('b').textContent=row.dataset.tip;tip.querySelector('span').textContent=row.dataset.text;tip.style.display='block'});row.addEventListener('mousemove',e=>{tip.style.left=Math.min(innerWidth-235,e.clientX+14)+'px';tip.style.top=Math.min(innerHeight-85,e.clientY+14)+'px'});row.addEventListener('mouseleave',()=>tip.style.display='none');row.addEventListener('click',()=>{if(mobile){tip.querySelector('b').textContent=row.dataset.tip;tip.querySelector('span').textContent=row.dataset.text;tip.style.display=tip.style.display==='block'?'none':'block';tip.style.left='12px';tip.style.top='auto';tip.style.bottom='130px'}})});addEventListener('click',e=>{if(mobile&&!e.target.closest('.row'))tip.style.display='none'});function adaptive(now){if(now-fpsTime<700)return;fps=Math.round(frames*1000/(now-fpsTime));document.getElementById('fps').textContent=fps;frames=0;fpsTime=now;if(!mobile){if(fps<48&&quality>.72){quality-=.08;resize()}else if(fps>57&&quality<1){quality=Math.min(1,quality+.04);resize()}}}function loop(now){frames++;adaptive(now);const raw=Math.min(32,now-last);last=now;const dt=raw/16.667;ctx.fillStyle='#06121f';ctx.fillRect(0,0,W,H);rebuildFishGrid();for(const f of fish)f.step(dt);rebuildFlowGrid();for(let i=flows.length-1;i>=0;i--){flows[i].life-=mobile?.075:.06;if(flows[i].life<=0)flows.splice(i,1)}for(let i=ripples.length-1;i>=0;i--){const r=ripples[i];r.r+=mobile?2.6:3.4;r.life-=mobile?.06:.045;if(r.life<=0)ripples.splice(i,1)}ctx.globalAlpha=1;for(const f of fish)f.draw();if(flows.length){ctx.globalAlpha=.11;ctx.strokeStyle='#65e8ff';ctx.lineWidth=1;for(const q of flows){ctx.beginPath();ctx.arc(q.x,q.y,7+q.p*4*(1-q.life*.5),0,6.283);ctx.stroke()}}if(ripples.length){ctx.globalAlpha=.2;ctx.strokeStyle='#9ceeff';ctx.lineWidth=1.1;for(const r of ripples){ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,6.283);ctx.stroke()}}ctx.globalAlpha=1;mode.textContent=m.on?'ATTRACT':ripples.length?'RIPPLE':flows.length?'FLOW':m.inside?'AVOID':'WANDER';requestAnimationFrame(loop)}resize();make();requestAnimationFrame(loop)</script></body></html>
