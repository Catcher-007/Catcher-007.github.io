<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#06121f">
    <meta name="description" content="Interactive Boids fish school simulation">
    <title>AQUA — 灵动鱼群</title>
    <style>
        :root {
            --bg: #06121f;
            --panel: rgba(8, 24, 40, .68);
            --line: rgba(170, 225, 255, .14);
            --text: #edf9ff;
            --muted: #8ba9bb;
            --cyan: #65e8ff;
            --blue: #5b8cff;
            --shadow: 0 24px 70px rgba(0, 0, 0, .38);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
        }

        body {
            color: var(--text);
            font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            cursor: default;
        }

        canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            cursor: none;
        }

        .vignette {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 72% 18%, rgba(36, 156, 210, .12), transparent 30%),
                radial-gradient(circle at 20% 82%, rgba(67, 91, 196, .10), transparent 32%),
                linear-gradient(180deg, rgba(2, 10, 18, .08), rgba(2, 9, 17, .55));
        }

        .noise {
            position: fixed;
            inset: 0;
            opacity: .035;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
        }

        .hud {
            position: fixed;
            inset: 0;
            padding: 28px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .topbar {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
        }

        .brand, .panel, .hint, .stats {
            background: var(--panel);
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
            backdrop-filter: blur(18px) saturate(130%);
            -webkit-backdrop-filter: blur(18px) saturate(130%);
        }

        .brand {
            padding: 18px 20px;
            border-radius: 18px;
            min-width: 250px;
        }

        .eyebrow {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--cyan);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .18em;
            text-transform: uppercase;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--cyan);
            box-shadow: 0 0 14px var(--cyan);
        }

        h1 {
            margin: 8px 0 3px;
            font-size: clamp(25px, 3vw, 38px);
            line-height: 1;
            letter-spacing: -.04em;
        }

        .subtitle {
            margin: 0;
            color: var(--muted);
            font-size: 12px;
        }

        .panel {
            width: min(290px, calc(100vw - 56px));
            padding: 16px;
            border-radius: 18px;
            pointer-events: auto;
        }

        .panel-title {
            margin-bottom: 12px;
            color: var(--muted);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase;
        }

        .control {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 9px 0;
            border-top: 1px solid rgba(255,255,255,.07);
        }

        .control:first-of-type { border-top: 0; }

        .control label {
            color: #c5dbe7;
            font-size: 13px;
        }

        input[type="range"] {
            width: 105px;
            accent-color: var(--cyan);
        }

        .value {
            width: 38px;
            color: var(--cyan);
            font-size: 12px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        button {
            width: 100%;
            margin-top: 8px;
            padding: 10px 12px;
            border: 1px solid rgba(101,232,255,.18);
            border-radius: 10px;
            color: var(--text);
            background: rgba(101,232,255,.07);
            cursor: pointer;
            transition: .2s ease;
        }

        button:hover {
            background: rgba(101,232,255,.14);
            border-color: rgba(101,232,255,.35);
            transform: translateY(-1px);
        }

        .bottom {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 18px;
        }

        .hint {
            padding: 13px 16px;
            border-radius: 14px;
            color: #b9d2df;
            font-size: 12px;
        }

        .hint strong { color: #f3fcff; }

        .stats {
            display: flex;
            gap: 20px;
            padding: 13px 16px;
            border-radius: 14px;
            min-width: 190px;
        }

        .stat span {
            display: block;
            color: var(--muted);
            font-size: 9px;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        .stat b {
            display: block;
            margin-top: 2px;
            font-size: 14px;
            font-variant-numeric: tabular-nums;
        }

        @media (max-width: 700px) {
            .hud { padding: 16px; }
            .topbar { align-items: stretch; }
            .brand { min-width: 0; padding: 15px; }
            .panel { display: none; }
            .bottom { align-items: flex-end; }
            .stats { min-width: 0; }
            .hint { max-width: 62vw; line-height: 1.5; }
        }
    </style>
</head>
<body>
    <canvas id="fishCanvas"></canvas>
    <div class="vignette"></div>
    <div class="noise"></div>

    <main class="hud">
        <div class="topbar">
            <section class="brand">
                <div class="eyebrow"><i class="dot"></i> Interactive Simulation</div>
                <h1>AQUA</h1>
                <p class="subtitle">Boids · 群体智能 · Canvas 2D</p>
            </section>

            <aside class="panel">
                <div class="panel-title">Simulation</div>
                <div class="control">
                    <label for="count">Fish</label>
                    <input id="count" type="range" min="60" max="300" value="200">
                    <span class="value" id="countValue">200</span>
                </div>
                <div class="control">
                    <label for="speed">Speed</label>
                    <input id="speed" type="range" min="50" max="160" value="100">
                    <span class="value" id="speedValue">1.0×</span>
                </div>
                <div class="control">
                    <label for="attraction">Attraction</label>
                    <input id="attraction" type="range" min="30" max="150" value="80">
                    <span class="value" id="attractionValue">0.80</span>
                </div>
                <button id="reset">重新生成鱼群</button>
            </aside>
        </div>

        <div class="bottom">
            <div class="hint">
                <strong>移动指针</strong> 驱散鱼群　·　<strong>按住左键</strong> 聚拢鱼群
            </div>
            <div class="stats">
                <div class="stat"><span>School</span><b id="fishStat">200</b></div>
                <div class="stat"><span>FPS</span><b id="fpsStat">60</b></div>
                <div class="stat"><span>Mode</span><b id="modeStat">WANDER</b></div>
            </div>
        </div>
    </main>

    <script>
        const canvas = document.getElementById('fishCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        let width = 0, height = 0;
        let fishArray = [];
        let fishCount = 200;
        let speedMultiplier = 1;
        let attractionStrength = .8;
        let paused = false;
        let lastTime = performance.now();
        let fps = 60;
        const mouse = { x: -1000, y: -1000, active: false, inside: false };

        const config = {
            maxSpeed: 3,
            perceptionRadius: 60,
            avoidanceRadius: 25,
            mouseAvoidanceRadius: 120
        };

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = Math.floor(width * dpr);
            canvas.height = Math.floor(height * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        window.addEventListener('resize', resize, { passive: true });
        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            mouse.inside = true;
        }, { passive: true });
        window.addEventListener('mouseleave', () => {
            mouse.inside = false;
            mouse.active = false;
        });
        window.addEventListener('mousedown', e => {
            if (e.button === 0) mouse.active = true;
        });
        window.addEventListener('mouseup', e => {
            if (e.button === 0) mouse.active = false;
        });
        window.addEventListener('blur', () => { mouse.active = false; });

        class Fish {
            constructor() { this.reset(); }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                const angle = Math.random() * Math.PI * 2;
                const speed = 1.4 + Math.random() * 1.8;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.accX = 0;
                this.accY = 0;
                this.maxSpeed = 2 + Math.random() * 2;
                this.color = `hsla(${185 + Math.random() * 50}, 85%, ${62 + Math.random() * 18}%, ${.5 + Math.random() * .35})`;
                this.size = 1.7 + Math.random() * 2.6;
            }

            applyBehaviors(fishes) {
                let ax = 0, ay = 0, cx = 0, cy = 0, sx = 0, sy = 0, total = 0;
                const radius = config.perceptionRadius;

                for (const other of fishes) {
                    if (other === this) continue;
                    const dx = this.x - other.x;
                    const dy = this.y - other.y;
                    const d = Math.hypot(dx, dy);
                    if (d > 0 && d < radius) {
                        ax += other.vx;
                        ay += other.vy;
                        cx += other.x;
                        cy += other.y;
                        if (d < config.avoidanceRadius) {
                            sx += dx / d;
                            sy += dy / d;
                        }
                        total++;
                    }
                }

                if (total) {
                    ax = (ax / total - this.vx) * .045;
                    ay = (ay / total - this.vy) * .045;
                    cx = (cx / total - this.x) * .0045;
                    cy = (cy / total - this.y) * .0045;
                    this.accX += ax + cx + sx * .14;
                    this.accY += ay + cy + sy * .14;
                }

                const mdx = mouse.x - this.x;
                const mdy = mouse.y - this.y;
                const md = Math.hypot(mdx, mdy);

                if (mouse.active && md > 8) {
                    const strength = attractionStrength * Math.min(1, 140 / md);
                    this.accX += (mdx / md) * strength;
                    this.accY += (mdy / md) * strength;
                    this.currentMaxSpeed = this.maxSpeed * 1.55;
                } else {
                    if (mouse.inside && md < config.mouseAvoidanceRadius && md > 0) {
                        const force = (1 - md / config.mouseAvoidanceRadius) * .42;
                        this.accX -= (mdx / md) * force;
                        this.accY -= (mdy / md) * force;
                    }
                    this.currentMaxSpeed = this.maxSpeed;
                }
            }

            update() {
                this.vx += this.accX * speedMultiplier;
                this.vy += this.accY * speedMultiplier;
                const speed = Math.hypot(this.vx, this.vy);
                const max = this.currentMaxSpeed * speedMultiplier;
                if (speed > max) {
                    this.vx = this.vx / speed * max;
                    this.vy = this.vy / speed * max;
                }
                this.x += this.vx * speedMultiplier;
                this.y += this.vy * speedMultiplier;
                this.accX = this.accY = 0;
            }

            edges() {
                const pad = 12;
                if (this.x < -pad) this.x = width + pad;
                if (this.x > width + pad) this.x = -pad;
                if (this.y < -pad) this.y = height + pad;
                if (this.y > height + pad) this.y = -pad;
            }

            draw() {
                const angle = Math.atan2(this.vy, this.vx);
                const s = this.size;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(angle);
                ctx.globalAlpha = .9;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.moveTo(s * 3.3, 0);
                ctx.quadraticCurveTo(s * .2, -s * 1.55, -s * 2.1, -s * .9);
                ctx.lineTo(-s * 2.8, 0);
                ctx.lineTo(-s * 2.1, s * .9);
                ctx.quadraticCurveTo(s * .2, s * 1.55, s * 3.3, 0);
                ctx.fill();
                ctx.restore();
            }
        }

        function createFish() {
            fishArray = Array.from({ length: fishCount }, () => new Fish());
            document.getElementById('fishStat').textContent = fishCount;
        }

        function drawBackground() {
            const gradient = ctx.createRadialGradient(width * .65, height * .35, 0, width * .55, height * .5, Math.max(width, height));
            gradient.addColorStop(0, '#0b2940');
            gradient.addColorStop(.45, '#071a2b');
            gradient.addColorStop(1, '#030b14');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);
        }

        function drawInteraction() {
            if (!mouse.inside) return;
            const radius = mouse.active ? 72 : 42;
            const glow = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, radius);
            glow.addColorStop(0, mouse.active ? 'rgba(101,232,255,.18)' : 'rgba(101,232,255,.06)');
            glow.addColorStop(1, 'rgba(101,232,255,0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(mouse.x, mouse.y, radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = mouse.active ? 'rgba(101,232,255,.48)' : 'rgba(160,220,240,.18)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(mouse.x, mouse.y, radius * .72, 0, Math.PI * 2);
            ctx.stroke();
        }

        function animate(now) {
            const dt = Math.min(100, now - lastTime);
            lastTime = now;
            const instantFps = dt > 0 ? 1000 / dt : 60;
            fps += (instantFps - fps) * .08;
            document.getElementById('fpsStat').textContent = Math.round(fps);
            document.getElementById('modeStat').textContent = paused ? 'PAUSED' : mouse.active ? 'ATTRACT' : 'WANDER';

            if (!paused) {
                drawBackground();
                for (const fish of fishArray) {
                    fish.applyBehaviors(fishArray);
                    fish.update();
                    fish.edges();
                    fish.draw();
                }
            } else {
                drawBackground();
                for (const fish of fishArray) fish.draw();
            }
            drawInteraction();
            requestAnimationFrame(animate);
        }

        const countInput = document.getElementById('count');
        const speedInput = document.getElementById('speed');
        const attractionInput = document.getElementById('attraction');

        countInput.addEventListener('input', e => {
            fishCount = Number(e.target.value);
            document.getElementById('countValue').textContent = fishCount;
            createFish();
        });

        speedInput.addEventListener('input', e => {
            speedMultiplier = Number(e.target.value) / 100;
            document.getElementById('speedValue').textContent = speedMultiplier.toFixed(1) + '×';
        });

        attractionInput.addEventListener('input', e => {
            attractionStrength = Number(e.target.value) / 100;
            document.getElementById('attractionValue').textContent = attractionStrength.toFixed(2);
        });

        document.getElementById('reset').addEventListener('click', createFish);

        window.addEventListener('keydown', e => {
            if (e.code === 'Space') {
                e.preventDefault();
                paused = !paused;
            }
            if (e.key.toLowerCase() === 'r') createFish();
        });

        resize();
        createFish();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
