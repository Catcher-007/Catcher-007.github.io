<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06121f"><title>AQUA — 灵动鱼群</title><style>:root{--bg:#06121f;--cyan:#65e8ff;--text:#edf9ff;--muted:#8ba9bb;--panel:rgba(8,24,40,.72)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);touch-action:none}body{color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:none}.bg,.rays,.particles,.vignette{position:fixed;inset:0;pointer-events:none}.bg{background:radial-gradient(ellipse at 50% 110%,#123d55 0,transparent 48%),radial-gradient(circle at 15% 25%,#0b2942,transparent 42%)}.rays{opacity:.1;background:linear-gradient(115deg,transparent 38%,rgba(120,225,255,.08) 45%,transparent 53%)}.vignette{background:linear-gradient(180deg,transparent 35%,rgba(1,8,15,.58))}.hud{position:fixed;inset:0;padding:28px;z-index:5;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}.brand,.panel,.stats,.hint{background:var(--panel);border:1px solid rgba(170,225,255,.14);box-shadow:0 18px 50px #0005;backdrop-filter:blur(10px)}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.brand{padding:18px 20px;border-radius:18px}.eyebrow{color:var(--cyan);font-size:11px;font-weight:700;letter-spacing:.18em}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan);margin-right:8px}h1{margin:8px 0 3px;font-size:clamp(26px,3vw,38px);line-height:1}.sub{margin:0;color:var(--muted);font-size:12px}.panel{width:290px;padding:16px;border-radius:18px;pointer-events:auto}.title{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.14em;margin-bottom:10px}.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #ffffff0d}.row:first-of-type{border:0}.row label{flex:1;color:#c5dbe7;font-size:13px}input{width:105px;accent-color:var(--cyan)}.val{width:38px;text-align:right;color:var(--cyan);font-size:12px}button{width:100%;margin-top:8px;padding:10px;border:1px solid #65e8ff2e;border-radius:10px;background:#65e8ff0d;color:var(--text)}.tip{position:fixed;z-index:20;display:none;width:220px;padding:10px 12px;border:1px solid #65e8ff26;border-radius:11px;background:#071b2ce8;color:#b9d2df;font-size:11px;line-height:1.45;pointer-events:none}.tip b{display:block;color:var(--cyan);margin-bottom:3px}.bottom{display:flex;justify-content:space-between;align-items:end;gap:18px}.hint{padding:13px 16px;border-radius:14px;color:#b9d2df;font-size:12px}.stats{display:flex;gap:20px;padding:13px 16px;border-radius:14px}.stat span{display:block;color:var(--muted);font-size:9px;letter-spacing:.12em}.stat b{font-size:14px}.mobile{display:none}@media(max-width:700px){.hud{padding:12px;padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom))}.brand{padding:12px 14px;border-radius:15px}.eyebrow{font-size:9px}h1{font-size:26px}.sub{font-size:10px}.panel{display:none}.mobile{display:flex;position:fixed;right:12px;top:max(12px,env(safe-area-inset-top));gap:7px;pointer-events:auto}.mobile button{width:auto;margin:0;padding:9px 13px;border-radius:999px}.stats{width:100%;justify-content:space-between;padding:9px 11px;gap:12px}.hint{display:none}.stat span{font-size:8px}.stat b{font-size:12px}.mpanel{position:fixed;left:12px;right:12px;bottom:62px;padding:14px;border-radius:16px;display:none;pointer-events:auto}.mpanel.open{display:block}.touch{display:block;position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom));transform:translateX(-50%);white-space:nowrap;padding:8px 12px;border:1px solid #ffffff1c;border-radius:999px;background:#08182899;color:#b9d2df;font-size:10px}}@media(min-width:701px){.touch,.mpanel{display:none!important}}@media(max-width:700px){.bg,.rays{animation:none}.particles{opacity:.45}.hud .brand,.hud .stats{backdrop-filter:blur(8px)}} </style></head><body><canvas id="c"></canvas><div class="bg"></div><div class="rays"></div><div class="particles" id="p"></div><div class="vignette"></div><main class="hud"><div class="top"><section class="brand"><div class="eyebrow"><i class="dot"></i>INTERACTIVE SIMULATION</div><h1>AQUA</h1><p class="sub">Boids · 群体智能 · Canvas 2D</p></section><aside class="panel"><div class="title">SIMULATION</div><div class="row" data-tip="Fish" data-text="鱼群数量。数量越高越密集，也会增加 CPU 计算量。"><label>Fish</label><input id="count" type="range" min="60" max="300" value="160"><span class="val" id="cv">160</span></div><div class="row" data-tip="Speed" data-text="鱼群整体游动速度。数值越高，运动越活跃。"><label>Speed</label><input id="speed" type="range" min="50" max="160" value="90"><span class="val" id="sv">0.9×</span></div><div class="row" data-tip="Attraction" data-text="按住鼠标时的聚拢力度。越高，鱼群越快靠近指针。"><label>Attraction</label><input id="attr" type="range" min="30" max="150" value="65"><span class="val" id="av">0.65</span></div><button id="reset">重新生成鱼群</button></aside></div><div class="mobile"><button id="toggle">控制</button><button id="mreset">重置</button></div><div class="mpanel panel" id="mp"><div class="title">SIMULATION</div><div class="row" data-tip="Fish" data-text="鱼群数量。数量越高越密集，也会增加 CPU 计算量。"><label>Fish</label><input id="mc" type="range" min="50" max="120" value="70"><span class="val" id="mcv">70</span></div><div class="row" data-tip="Speed" data-text="鱼群整体游动速度。数值越高，运动越活跃。"><label>Speed</label><input id="ms" type="range" min="50" max="160" value="80"><span class="val" id="msv">0.8×</span></div><div class="row" data-tip="Attraction" data-text="按住屏幕时的聚拢力度。越高，鱼群越快靠近触点。"><label>Attraction</label><input id="ma" type="range" min="30" max="150" value="60"><span class="val" id="mav">0.60</span></div></div><div class="bottom"><div class="hint"><b>移动指针</b> 水流 · <b>按住左键</b> 聚拢 · <b>点击</b> 水波</div><div class="stats"><div class="stat"><span>SCHOOL</span><b id="fs">160</b></div><div class="stat"><span>FPS</span><b id="fps">60</b></div><div class="stat"><span>SIM</span><b id="sim">60Hz</b></div></div></div></main><div class="touch">触摸拖动：水流与波纹 · 长按：聚拢</div><div class="tip" id="tip"><b></b><span></span></div><script>(()=>{const canvas=document.getElementById('c'),ctx=canvas.getContext('2d',{alpha:false}),isMobile=matchMedia('(max-width:700px)').matches;let W=innerWidth,H=innerHeight,dpr=1,renderScale=1,fish=[],grid=new Map(),flowGrid=new Map(),flows=[],ripples=[],count=isMobile?70:160,speed=isMobile?.8:.9,attraction=isMobile?.6:.65,simHz=isMobile?30:45,simStep=1000/simHz,simAccumulator=0,lastFrame=performance.now(),fpsFrames=0,fpsClock=lastFrame,fpsValue=60,adaptiveClock=lastFrame;const CELL=64,CELL2=CELL*CELL,FLOW_CELL=128,FLOW_R=128,MAX_FLOW=isMobile?7:14,MAX_RIPPLE=isMobile?3:6,mouse={x:-9999,y:-9999,down:false,inside:false};function resize(){dpr=Math.min(devicePixelRatio||1,isMobile?1.15:1.25)*renderScale;W=innerWidth;H=innerHeight;canvas.width=Math.max(1,W*dpr);canvas.height=Math.max(1,H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}function key(gx,gy){return gx+','+gy}function rebuildFishGrid(){grid.clear();for(let i=0;i<fish.length;i++){const f=fish[i],k=key((f.x/CELL)|0,(f.y/CELL)|0),a=grid.get(k);a?a.push(i):grid.set(k,[i])}}function rebuildFlowGrid(){flowGrid.clear();for(let i=0;i<flows.length;i++){const q=flows[i],k=key((q.x/FLOW_CELL)|0,(q.y/FLOW_CELL)|0),a=flowGrid.get(k);a?a.push(i):flowGrid.set(k,[i])}}class Fish{constructor(){this.x=Math.random()*W;this.y=Math.random()*H;const a=Math.random()*6.283,s=1.2+Math.random()*1.7;this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s;this.max=1.8+Math.random()*1.8;this.depth=Math.random();this.size=1.7+Math.random()*2.1;this.phase=Math.random()*6.283;this.tailSpeed=.11+Math.random()*.08;this.ax=0;this.ay=0;this.limit=this.max}simulate(dt){let avx=0,avy=0,cx=0,cy=0,sx=0,sy=0,n=0,gx=(this.x/CELL)|0,gy=(this.y/CELL)|0;for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){const a=grid.get(key(gx+ox,gy+oy));if(!a)continue;for(let k=0;k<a.length;k++){const o=fish[a[k]];if(o===this)continue;const dx=this.x-o.x,dy=this.y-o.y,d2=dx*dx+dy*dy;if(d2>0&&d2<CELL2){const inv=1/Math.sqrt(d2);avx+=o.vx;avy+=o.vy;cx+=o.x;cy+=o.y;if(d2<576){sx+=dx*inv;sy+=dy*inv}n++}}}let ax=0,ay=0;if(n){ax+=(avx/n-this.vx)*.04+(cx/n-this.x)*.004+sx*.13;ay+=(avy/n-this.vy)*.04+(cy/n-this.y)*.004+sy*.13}const mdx=mouse.x-this.x,mdy=mouse.y-this.y,md2=mdx*mdx+mdy*mdy;if(mouse.down&&md2>64){const inv=1/Math.sqrt(md2),f=attraction*Math.min(1,140*inv);ax+=mdx*inv*f;ay+=mdy*inv*f;this.limit=this.max*1.45}else{if(mouse.inside&&md2<14400&&md2>0){const d=Math.sqrt(md2),f=(1-d/120)*.34;ax-=mdx/d*f;ay-=mdy/d*f}this.limit=this.max}const fgx=(this.x/FLOW_CELL)|0,fgy=(this.y/FLOW_CELL)|0;for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){const a=flowGrid.get(key(fgx+ox,fgy+oy));if(!a)continue;for(let k=0;k<a.length;k++){const q=flows[a[k]],dx=this.x-q.x,dy=this.y-q.y,d2=dx*dx+dy*dy;if(d2<FLOW_R*FLOW_R){const inv=1/Math.sqrt(d2||1),fall=1-Math.sqrt(d2)/FLOW_R;ax+=q.vx*q.p*fall*.045;ay+=q.vy*q.p*fall*.045}}}for(let i=0;i<ripples.length;i++){const r=ripples[i],dx=this.x-r.x,dy=this.y-r.y,d2=dx*dx+dy*dy,rr=r.r+42;if(d2<rr*rr){const d=Math.sqrt(d2)||1,ring=Math.abs(d-r.r);if(ring<34){const f=(1-ring/34)*r.power*.012;ax+=dx/d*f;ay+=dy/d*f}}}const ds=.7+this.depth*.42;this.vx+=ax*speed*ds*dt;this.vy+=ay*speed*ds*dt;const v2=this.vx*this.vx+this.vy*this.vy,lim=this.limit*speed*ds,lim2=lim*lim;if(v2>lim2){const inv=1/Math.sqrt(v2);this.vx*=inv*lim;this.vy*=inv*lim}this.x+=this.vx*ds*dt;this.y+=this.vy*ds*dt;this.phase+=this.tailSpeed*(.8+Math.sqrt(this.vx*this.vx+this.vy*this.vy)*.06)*dt;if(this.x<-24)this.x=W+24;else if(this.x>W+24)this.x=-24;if(this.y<-24)this.y=H+24;else if(this.y>H+24)this.y=-24}draw(){const z=.68+this.depth*.7,s=this.size*z,a=.18+this.depth*.7,t=Math.sin(this.phase)*.22,ang=Math.atan2(this.vy,this.vx),cs=Math.cos(ang),sn=Math.sin(ang),px=this.x,py=this.y,p=[[3.1*s,0],[-.45*s,-.7*s],[-1.55*s,-(1.25+t)*s],[-.85*s,0],[-1.55*s,(1.25-t)*s],[-.45*s,.7*s]];ctx.globalAlpha=a;ctx.fillStyle=this.depth>.72?'#8eefff':this.depth>.38?'#62dff5':'#48b9d6';ctx.beginPath();for(let i=0;i<p.length;i++){const X=px+p[i][0]*cs-p[i][1]*sn,Y=py+p[i][0]*sn+p[i][1]*cs;i?ctx.lineTo(X,Y):ctx.moveTo(X,Y)}ctx.closePath();ctx.fill()}}function reset(){fish=Array.from({length:count},()=>new Fish());document.getElementById('fs').textContent=count}function addFlow(x,y,vx,vy){flows.push({x,y,vx,vy,p:Math.min(2.1,Math.hypot(vx,vy)*.4),life:1});if(flows.length>MAX_FLOW)flows.shift()}function addRipple(x,y,power=.8){ripples.push({x,y,r:5,life:1,power});if(ripples.length>MAX_RIPPLE)ripples.shift()}let lastPointer=null;function move(e){const q=e.touches?e.touches[0]:e,now=performance.now();if(lastPointer){const dt=Math.max(8,now-lastPointer.t),dx=q.clientX-lastPointer.x,dy=q.clientY-lastPointer.y,v=Math.hypot(dx,dy)/(dt/16);if(v>1)addFlow(q.clientX,q.clientY,dx/16,dy/16)}lastPointer={x:q.clientX,y:q.clientY,t:now};mouse.x=q.clientX;mouse.y=q.clientY;mouse.inside=true}addEventListener('mousemove',move,{passive:true});addEventListener('mousedown',e=>{if(e.button===0){mouse.down=true;addRipple(e.clientX,e.clientY,1)}});addEventListener('mouseup',()=>mouse.down=false);addEventListener('mouseleave',()=>{mouse.inside=false;mouse.down=false});addEventListener('click',e=>{if(e.target===canvas)addRipple(e.clientX,e.clientY,.7)});addEventListener('touchstart',e=>{lastPointer=null;move(e);mouse.down=true;addRipple(e.touches[0].clientX,e.touches[0].clientY,1)},{passive:true});addEventListener('touchmove',move,{passive:true});addEventListener('touchend',()=>{mouse.down=false;mouse.inside=false;lastPointer=null},{passive:true});addEventListener('blur',()=>mouse.down=false);addEventListener('resize',resize,{passive:true});function simulate(dt){rebuildFishGrid();rebuildFlowGrid();for(let i=0;i<fish.length;i++)fish[i].simulate(dt)}function updateEffects(){for(let i=flows.length-1;i>=0;i--){flows[i].life-=isMobile?.09:.07;if(flows[i].life<=0)flows.splice(i,1)}for(let i=ripples.length-1;i>=0;i--){const r=ripples[i];r.r+=isMobile?3:3.8;r.life-=isMobile?.07:.055;if(r.life<=0)ripples.splice(i,1)}rebuildFlowGrid()}function draw(){ctx.fillStyle='#06121f';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;for(let i=0;i<fish.length;i++)fish[i].draw();if(flows.length){ctx.globalAlpha=.1;ctx.strokeStyle='#65e8ff';ctx.lineWidth=1;for(const q of flows){ctx.beginPath();ctx.arc(q.x,q.y,7+q.p*4*(1-q.life*.5),0,6.283);ctx.stroke()}}if(ripples.length){ctx.globalAlpha=.18;ctx.strokeStyle='#9ceeff';for(const r of ripples){ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,6.283);ctx.stroke()}}ctx.globalAlpha=1}function adaptive(now){if(isMobile||now-adaptiveClock<1200)return;adaptiveClock=now;if(fpsValue<42&&renderScale>.72){renderScale=Math.max(.72,renderScale-.08);resize()}else if(fpsValue>57&&renderScale<1){renderScale=Math.min(1,renderScale+.04);resize()}if(fpsValue<38&&simHz>30){simHz=30;simStep=1000/simHz}else if(fpsValue>56&&simHz<45){simHz=45;simStep=1000/simHz}}function frame(now){const frameDt=Math.min(50,now-lastFrame);lastFrame=now;simAccumulator+=frameDt;while(simAccumulator>=simStep){simulate(simStep/16.667);simAccumulator-=simStep}updateEffects();draw();fpsFrames++;if(now-fpsClock>=800){fpsValue=Math.round(fpsFrames*1000/(now-fpsClock));fpsFrames=0;fpsClock=now;document.getElementById('fps').textContent=fpsValue;document.getElementById('sim').textContent=simHz+'Hz'}adaptive(now);requestAnimationFrame(frame)}count.oninput=e=>{count=+e.target.value;cv.textContent=count;reset()};speed.oninput=e=>{speed=+e.target.value/100;sv.textContent=speed.toFixed(1)+'×'};attr.oninput=e=>{attraction=+e.target.value/100;av.textContent=attraction.toFixed(2)};reset.onclick=reset;function syncMobile(){count=+mc.value;speed=+ms.value/100;attraction=+ma.value/100;mcv.textContent=count;msv.textContent=speed.toFixed(1)+'×';mav.textContent=attraction.toFixed(2);reset()}mc.oninput=ms.oninput=ma.oninput=syncMobile;mreset.onclick=reset;toggle.onclick=()=>mp.classList.toggle('open');const tip=document.getElementById('tip');document.querySelectorAll('[data-tip]').forEach(row=>{row.addEventListener('mouseenter',()=>{if(isMobile)return;tip.querySelector('b').textContent=row.dataset.tip;tip.querySelector('span').textContent=row.dataset.text;tip.style.display='block'});row.addEventListener('mousemove',e=>{tip.style.left=Math.min(innerWidth-235,e.clientX+14)+'px';tip.style.top=Math.min(innerHeight-90,e.clientY+14)+'px'});row.addEventListener('mouseleave',()=>tip.style.display='none');row.addEventListener('click',()=>{if(isMobile){tip.querySelector('b').textContent=row.dataset.tip;tip.querySelector('span').textContent=row.dataset.text;tip.style.display=tip.style.display==='block'?'none':'block';tip.style.left='12px';tip.style.bottom='130px';tip.style.top='auto'}})});addEventListener('click',e=>{if(isMobile&&!e.target.closest('.row'))tip.style.display='none'});resize();reset();requestAnimationFrame(frame)})();</script></body></html>
